# Repository-level workspace root.
#
# The Rust solution lives in `CoreGeek/`, but it is not the only thing in this
# repository (the Python demo and the docs are here too). Without this file the
# plain `cargo test --release --locked` — the command the review harness runs,
# from the repository root — dies with
#
#     error: could not find `Cargo.toml` in `/.../Competition` or any parent
#
# before a single test is built, which reads exactly like "the fix did not pass
# cargo test". Declaring the crate as a workspace member makes the bare command
# work from the root while leaving `cd CoreGeek && cargo ...` working unchanged.
#
# `CoreGeek/run.sh` passes `--target-dir` so the binary always lands in
# `CoreGeek/target/release/coregeek` whether the crate is built from here or
# from its own directory. `CoreGeek/Cargo.lock` is kept (format version 3) for
# builds that copy the crate out of the repository on its own; `Cargo.lock`
# here is a verbatim copy of it and must stay byte-identical.
[workspace]
members = ["CoreGeek"]
resolver = "2"

# Profiles are only read from the workspace root, so the release profile
# declared by the crate (LTO + one codegen unit) is repeated here — otherwise a
# root-level `cargo build --release` would silently ship a different binary.
[profile.release]
lto = true
codegen-units = 1
