[package]
name = "coregeek"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Future War competition bot (Rust 1.98.1)"

# Exact pins kept for reproducible builds. With Rust 1.98.1 the resolver
# handles MSRV correctly, but the lock file stays committed so `--locked`
# catches accidental regeneration.
[dependencies]
serde = { version = "=1.0.193", features = ["derive"] }
serde_json = "=1.0.108"
tokio = { version = "=1.35.1", features = ["rt", "net", "macros"] }
hyper = { version = "=1.1.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.3", features = ["tokio"] }
http-body-util = "=0.1.0"

[profile.release]
lto = true
codegen-units = 1
# NOTE: never set panic="abort" here — the judger does NOT restart a crashed
# process; unwinding keeps panics confined to a single connection task.
